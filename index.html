  cards.push([t('p3.confianzas.' + R.confianza), P.confianza, '', t('p3.confianzaExpl.' + R.confianza)]);
  return `<ul class="tarjetas">${cards.map(([v, e, cls, nota]) => `<li class="tarjeta"><span class="valor ${cls}">${v}</span><span class="etq-t">${e}</span>${nota ? `<span class="nota-t">${nota}</span>` : ''}</li>`).join('')}</ul>`;
}

    ...(e.modoTotal ? [] : [[I.personas, e.personas !== null ? f(e.personas) : I.noIndicado, 'introducido']]),
    [P2.correccion, corr, 'introducido'],
    [P2.coste, e.coste === null ? I.noIndicado : `${f(e.coste)} ${P2.sufijoEuroHora} (${P2.tiposCoste[e.tipoCoste]})`, 'introducido'],
    ...(e.espera ? [[P2.espera, f(e.espera) + ' h', 'introducido']] : []),
    [I.herramientas, estado.herramientas.size ? [...estado.herramientas].map(h => P2.herramientas[h]).join(', ') : I.ninguna, 'introducido']
  ];
  if (R.h) datos.push([I.ejecuciones, f(R.h.E), 'calculado'], [T.p5.horasAnio, fH(R.h.hActual), 'calculado']);
  if (R.h && R.h.costeAnual !== null) datos.push([T.p5.costeLaboral, fE(R.h.costeAnual), 'calculado']);
  const puntos = d.desperdicios.map(w => {
    const D = T.desperdicios[w.id];
    return `<h3>${D.nombre}</h3><p><strong>${T.p3.ficha.evidencia}:</strong> ${w.senales.map(s => `${t('senales.' + s.id + '.nombre')} (${T.fuerza[s.fuerza].toLowerCase()}). ${textoOrigen(s.origen)}`).join(' ')}</p>
      <p><strong>${T.p3.ficha.consecuencia}:</strong> ${D.consecuencia}</p><p><strong>${T.p3.ficha.causa}:</strong> ${D.causa} ${T.p3.causaNota}</p>
      <p><strong>${T.p3.ficha.recomendacion}:</strong> ${w.senales.map(s => t('senales.' + s.id + '.accion')).join(' ')}</p><p><strong>${T.p3.ficha.confianza}:</strong> ${t('p3.confianzaSenal.' + w.confianza)}</p>`;
  }).join('') || `<p>${T.p3.sinPuntos}</p>`;
  const factores = [...(d.bloqueante ? [d.bloqueante] : []), ...d.factores].map(s => `<li><strong>${t('senales.' + s.id + '.nombre')}.</strong> ${t('senales.' + s.id + '.explicacion')} <em>${textoOrigen(s.origen)}</em></li>`).join('');
  const criticos = d.criticos.map(c => `<li>${t('senales.' + c.id + '.texto')} <em>${c.origenes.map(textoOrigen).join(' · ')}</em></li>`).join('');
  const matriz = `<figure><figcaption>${t('p3.matriz', { proceso: T.ejes.proceso, viabilidad: T.ejes.viabilidad })}</figcaption><table class="matriz-informe"><thead><tr><th></th>${REGLAS.ejeViabilidad.map(v => `<th>${V[v]}</th>`).join('')}</tr></thead><tbody>${REGLAS.ejeProceso.map(p => `<tr><th>${V[p]}</th>${REGLAS.ejeViabilidad.map(v => { const cls = celdaMatriz(d, p, v); const act = cls !== ''; return `<td class="${act ? 'actual' : ''}">${act ? '▶ ' : ''}${t('p3.nombresMatriz.' + REGLAS.matriz[p][v])}${act ? `<br>(${cls === 'actual' ? t('p3.tuTarea') : t('p3.posible')})` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></figure>`;
  const estr = `<table><tbody>${REGLAS.ordenEstrategias.map(k => { const x = d.estrategias[k]; return `<tr><th scope="row">${T.estrategias.nombres[k]}</th><td>${T.estrategias.estados[x.estado]}${x.revisar ? ' · ' + T.estrategias.revisar : ''}</td><td>${x.motivos.map(textoMotivo).join(' ')}</td></tr>`; }).join('')}</tbody></table>
    <p><strong>${T.p4.combinacion}:</strong> ${d.combinacion.length ? d.combinacion.map(k => T.estrategias.nombres[k]).join(' → ') : T.p4.sinCombinacion}</p>
    <p><strong>${T.p4.indice}:</strong> ${d.indice.valor === null ? '—' : d.indice.valor + ' / 100'}. ${T.p4.indiceNota}</p>`;
  let economia = `<p>${I.cualitativo}</p>`, hip = [];
  if (R.h) {
    const altG = alternativaDestacada(R);
    const g = datosGraficos(R, altG);
    const filasSvg = g.filasH.map(([etq, v]) => [etq, v]);
    const incompleta = REGLAS.alternativas.some(a => !R.eco[a].disponible);
    economia = `<p>${t('informe.escenarioSel', { e: T.p5.nombresEscenarios[estado.escenario] })}</p>${incompleta ? `<div class="destacado"><strong>${T.p5.incompleta}</strong> ${T.p5.incompletaTexto}</div>` : ''}${filasComparador(R, false)}<p>${T.p5.combinadaNota} ${T.p5.valorNota} ${T.p5.efectivoNota}</p>
      ${svgBarrasH(filasSvg, T.p5.grafHoras)}${g.acum ? svgAcumulado(g.acum, t(g.enEuros ? 'p5.grafAcumulado' : 'p5.grafAcumuladoHoras', { alt: nombreAlt(altG) }), g.enEuros) : ''}`;
    for (const k of Object.keys(CONFIG.reduccionAutomatizar)) {
      hip.push(t('informe.hipotesis', { tipo: T.p5.ro.toLowerCase(), e: nombreEsc(k), x: R.pot.ro[k] === null ? I.noIndicado : calculo.fPct(R.pot.ro[k]) }));
      hip.push(t('informe.hipotesis', { tipo: T.p5.ra.toLowerCase(), e: nombreEsc(k), x: R.pot.ra[k] === null ? I.noIndicado : calculo.fPct(R.pot.ra[k]) }));
    }
    const cost = REGLAS.alternativas.map(a => `${nombreAlt(a)}: ${['I', 'Mt', 'M', 'L', 'O', 'E2'].map(c => `${T.p5.campos[c]} ${R.pot.costes[a][c] === null ? I.noIndicado : f(R.pot.costes[a][c])}`).join(' · ')}`);
    hip.push(...cost);
    if (R.pot.E !== null) hip.push(`${T.p5.errorActual}: ${fE(R.pot.E)}`);
  }
  hip.push(t('informe.hipCalendario', { x: t('informe.calendarioValor', { d: f(e.cal.diasLaborables ?? 0), s: f(calculo.semanasActivas(e.cal)), m: f(e.cal.mesesActivos ?? 0), j: f(e.cal.jornadaHoras ?? 0) }) }));
  const plan = REGLAS.tiposPlan.map(tipo => {
    const l = d.acciones.filter(a => a.tipo === tipo);
    return l.length ? `<h3>${T.p6.tipos[tipo]}</h3><ol>${l.map(a => `<li><strong>${textoAccion(a)}</strong> ${T.p6.campos.prioridad}: ${T.p6.prioridades[a.prioridad]}. ${T.p6.campos.depende}: ${a.depende ? T.p6.depende : T.p6.noDepende}. ${T.p6.campos.indicador}: ${indicadorAccion(a)} <em>${justificacionAccion(a)}</em></li>`).join('')}</ol>` : '';
  }).join('') || `<p>${T.p6.sinAcciones}</p>`;
  $('#informe').innerHTML = `<h1>${I.titulo}</h1><p>${t('informe.fecha', { f: new Date().toLocaleDateString(T.formato.locale, { day: 'numeric', month: 'long', year: 'numeric' }) })}</p>
    <h2>1. ${S[0]}</h2><p>${desc ? esc(desc).replace(/\n/g, '<br>') : I.sinDescripcion}</p><h3>${I.parametros}</h3>${tabla(datos)}
    <h2>2. ${S[1]}</h2>${d.filtro ? `<div class="destacado"><strong>${T.p3.filtroTitulo}</strong> ${t('p3.filtroTexto', { horas: R.h ? t('p3.filtroHoras', { x: fH(R.h.hActual) }) : T.p3.filtroSinHoras })}</div>` : ''}
      ${provisional}${recTexto}<p>${t('p3.posicion', { v: textoEje(d, 'viabilidad'), p: textoEje(d, 'proceso') })} · ${t('p3.conteo', { f: d.nFuertes, l: d.nLeves })} · ${T.p3.tarjetas.confianza}: ${t('p3.confianzas.' + R.confianza)}</p>
      ${d.frecuenciaBaja && d.recomendacion ? `<p>${t('p3.ajustePocoFrecuente', { m: t('p3.nombresMatriz.' + d.recomendacionMatriz) })}</p>` : ''}${matriz}
    <h2>3. ${S[2]}</h2>${puntos}<h3>${T.p3.factores}: ${textoEje(d, 'viabilidad')}</h3>${factores ? `<ul>${factores}</ul>` : `<p>${T.p3.sinFactores}</p>`}${criticos ? `<h3>${T.p3.criticos}</h3><ul>${criticos}</ul>` : ''}
    <h2>4. ${S[3]}</h2>${estr}
    <h2>5. ${S[4]}</h2>${economia}
    <h2>6. ${S[5]}</h2><ul>${hip.map(x => `<li>${x}</li>`).join('')}</ul>
    <h2>7. ${S[6]}</h2>${plan}<p>${T.p6.medirNota}</p>
    <h2>8. ${S[7]}</h2><p>${htmlEstimacion()}</p><ul>${supuestosLista(R).map(x => `<li>${x}</li>`).join('')}</ul>
      ${R.faltantes.length ? `<h3>${T.p3.faltan}</h3><ul>${R.faltantes.map(x => `<li>${textoFaltante(x)}</li>`).join('')}</ul>` : ''}
    <p style="margin-top:12pt">${t('privacidad')}</p>`;
  document.documentElement.classList.add('con-informe');
}
window.addEventListener('beforeprint', construirInforme);

/* ---------- Idioma, inicio y nuevo análisis ---------- */
function capturarCampos() {
  const datos = {};
  $$('#p1 textarea, #p2 input[type=text], #p2 select, #p2 input[name=modo], #p2 input[name=correccion]').forEach(el => {
    datos[el.id] = (el.type === 'radio') ? el.checked : el.value;
  });
  datos.__abiertos = $$('#p2 details[id]').filter(d => d.open).map(d => d.id);
  return datos;
}
function restaurarCampos(datos) {
  for (const [id, v] of Object.entries(datos)) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.type === 'radio') el.checked = v; else el.value = v;
  }
  for (const id of datos.__abiertos || []) { const d = document.getElementById(id); if (d) d.open = true; }
}
function aplicarIdioma(l) {
  if (!textos[l]) return;
  const datos = $('#minutos') ? capturarCampos() : null;
  IDIOMA = l; T = textos[l]; calculo.formato = T.formato;
  document.documentElement.lang = l; document.title = T.meta.titulo;
  renderMenu(); renderEstatico(); renderP1(); renderP2();
  if (datos) restaurarCampos(datos);
  actualizarP2(); renderPreguntas();
  for (let i = 1; i <= 6; i++) $('#p' + i).hidden = i !== estado.pantalla;
  if (estado.pantalla >= 3) renderResultado(estado.pantalla);
  renderNav();
}
function volverAlInicio() {
  $('#inicio').scrollIntoView({ behavior: reducirMovimiento() ? 'auto' : 'smooth' });
  $('#menu-marca').focus({ preventScroll: true });
}
function nuevoAnalisis() {
  if (!window.confirm(t('confirmarNuevo'))) return;
  estado = estadoInicial();
  document.documentElement.classList.remove('con-informe');
  $('#informe').innerHTML = '';
  renderP1(); renderP2();
  irAPantalla(1);
  $('#herramienta').scrollIntoView({ behavior: reducirMovimiento() ? 'auto' : 'smooth' });
}

/* ---------- Eventos (se conectan una sola vez) ---------- */
function conectarEventos() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-accion]');
    if (!b || b.disabled) return;
    const a = b.dataset.accion;
    if (a === 'ir') irAPantalla(Number(b.dataset.destino));
    else if (a === 'idioma') { const l = b.dataset.idioma; aplicarIdioma(l); $(`#menu button[data-idioma="${l}"]`).focus(); }
    else if (a === 'analizar') analizarYContinuar();
    else if (a === 'verDiagnostico') verDiagnostico();
    else if (a === 'sinTiempo') { estado.cualitativo = true; estado.diagnosticoPedido = true; irAPantalla(3); }
    else if (a === 'quitar') { delete estado.respuestas[b.dataset.pregunta]; delete estado.origen[b.dataset.pregunta]; renderPreguntas(); }
    else if (a === 'imprimir') { construirInforme(); window.print(); }
    else if (a === 'json') exportarJSON();
    else if (a === 'copiar') copiarResumen();
    else if (a === 'inicio') volverAlInicio();
    else if (a === 'nuevo') nuevoAnalisis();
  });
  const p2 = $('#p2');
  p2.addEventListener('input', e => {
    if (e.target.id === 'minutos') delete estado.camposProp.minutos;
    actualizarP2();
  });
  p2.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'frecuencia') { estado.tocados.add('frecuencia'); delete estado.camposProp.frecuencia; }
    const m = el.name && el.name.match(/^[pr]-(\w+)$/);
    if (m) { estado.respuestas[m[1]] = el.value; estado.origen[m[1]] = 'usuario'; renderPreguntas(); }
    if (el.type === 'checkbox' && el.id.startsWith('h-')) {
      if (el.checked) estado.herramientas.add(el.value); else estado.herramientas.delete(el.value);
      delete estado.herramientasProp[el.value]; renderHerramientas(); $('#' + el.id).focus();
    }
    if (el.name === 'correccion') renderPreguntas(); // la corrección hace aparecer la pregunta de retrabajo
    actualizarP2();
  });
  p2.addEventListener('focusout', e => { if (e.target.matches('input[type=text]')) { estado.tocados.add(e.target.id); actualizarP2(); } });
  const p5 = $('#p5');
  p5.addEventListener('input', e => {
    const id = e.target.id;
    let m;
    if ((m = id.match(/^(ro|ra)-(\w+)$/))) estado[m[1]][m[2]] = e.target.value;
    else if ((m = id.match(/^c-(\w+)-(\w+)$/))) estado.costes[m[1]][m[2]] = e.target.value;
    else if (id === 'E') estado.E = e.target.value;
    actualizarP5();
  });
  p5.addEventListener('change', e => { if (e.target.name === 'escenario') { estado.escenario = e.target.value; actualizarP5(); } });
}

/* ---------- Arranque ---------- */
conectarEventos();
aplicarIdioma(CONFIG.idiomaInicial);

// Acceso de solo lectura para pruebas.html (funciones puras y datos de configuración)
window.DMAP = Object.freeze({ CONFIG, PREGUNTAS, SENALES, REGLAS, ESTIMACION, ANALIZADOR, calculo, textos });
</script>
